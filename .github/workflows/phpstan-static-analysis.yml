name: Phpstan & Bladestan Static Analysis

on: [pull_request]

jobs:
  phpstan-bladestan:
    name: Phpstan & Bladestan Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP With Tools
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: zip, mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql
          tools: composer:v2

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Install Phpstan & Bladestan
        run: composer global require phpstan/phpstan tomasvotruba/bladestan --dev

      - name: Run Phpstan & Bladestan Static Analysis
        run: ~/.composer/vendor/bin/phpstan analyse assets/ config/ src/ --error-format=github
